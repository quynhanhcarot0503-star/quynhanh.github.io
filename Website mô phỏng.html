<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studywithbot — Học Ngữ văn</title>
<meta name="description" content="Công cụ học Ngữ văn cho học sinh THCS: phòng học tự do, phòng truyền đạt, phòng ôn thi, phòng thi mô phỏng, nhóm học tập và chế độ giáo viên.">
<style>html,body{margin:0;padding:0;background:#0F1A2B}#root{min-height:100vh}
#vv-fallback{color:#EAF0F7;font-family:system-ui,sans-serif;max-width:520px;margin:16vh auto;padding:0 24px;line-height:1.6}</style>
</head>
<body>
<div id="root"><div id="vv-fallback"><h2>Đang tải Studywithbot…</h2><p>Nếu trang không hiện sau vài giây, hãy mở file qua một địa chỉ web (https hoặc localhost) và bật kết nối mạng để tải phông chữ.</p></div></div>

<!-- ================== CẤU HÌNH NHANH — CHỈ SỬA DÒNG DƯỚI ĐÂY ==================
     Sau khi tạo Proxy (backend giữ khoá), dán địa chỉ Worker vào giữa hai dấu "".
     Ví dụ: window.VV_PROXY_URL = "https://studywithbot.tk-cua-ban.workers.dev";
     Khi đã điền, học sinh mở web qua QR là dùng được ngay, không cần nhập khoá.
     (Để trống nếu chưa dùng proxy — khi đó bấm nút bánh răng để nhập khoá.) -->
<script>
  window.VV_PROXY_URL = "";
  window.VV_MODEL = "";   // để trống = dùng claude-sonnet-5; hoặc ghi model khác
</script>
